<!DOCTYPE html>
<html>
<head>
    <title>Prime Number Checker</title>
    <style>
        :root{
            --bg-color: #eee;
            --font-color: #292929;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--font-color);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #292929;
                --font-color: #eee;
            }
        }
    </style>
    
</head>
<body>
    <h1>JavaScript Loops</h1>
    <h2>The While Loop</h2>

    <p id="demo"></p>

    <div id="ntext"></div>

    <script>
        console.log('Script started')
        function isPrime(n) 
        {
            if (n <= 1) return false; // Numbers less than or equal to 1 are not prime
            if (n === 2) return true; // 2 is prime
            if (n % 2 === 0) return false; // Check for even numbers greater than 2

            const limit = Math.floor(Math.sqrt(n)); // find the square root of n round to the nearest whole number
            for (let d = 3; d <= limit; d += 2) {
                if (n % d === 0) return false;
            }
            return true;
        }

        function add(a, b) {
            let z = a + b;
            console.log(`returned directly from the function: ${z}`);
            return z
        }

        let n1 = add(10, 20)
        let n2 = 40

        console.log( "addition: "+add(n1,n2))

        console.log(`Hello, That's a
         template "literal"! n1: 
         ${n1}`)

        let newText = `<ol><li>Hello world, 
            This is a template literal example.</li>
            <li>Total: ${(n1 * add(5,n2)).toFixed(4)}</li>
        </ol>`

        document.getElementById("ntext").innerHTML = newText


        let text = "";

        let start = 8;
        let inc = 0;
        let foundPrime = false
        while (!foundPrime) {
            let numb = start + inc
            foundPrime = isPrime(numb)
            if (foundPrime) {
                text += "first Prime Number after " + start + " is " + numb;
            }
            inc++;
        }

        document.getElementById("demo").innerHTML = text
        console.log(text)
        console.log('script ended')
    </script>

</body>

</html>
